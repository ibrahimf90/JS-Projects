<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Quiz | Test Your Knowledge</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="quiz-game.css">
</head>

<body>
    <!-- Decorative background element -->
    <div class="bg-blur"></div>

    <div class="shell">
        <!-- Back navigation link -->
        <a href="../../index.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
            Back to Projects Hub
        </a>

        <!-- ── SCREEN 1: Start ── -->
        <div id="start-screen" class="screen active">
            <h1>Pro Quiz<span>.</span></h1>
            <p>Choose a topic and test your knowledge.<br>5 questions, instant feedback.</p>
            <div class="topic-grid" id="topic-grid"></div>
            <button id="start-btn">Start Quiz →</button>
        </div>

        <!-- ── SCREEN 2: Question ── -->
        <div id="question-screen" class="screen">
            <div class="progress-wrap">
                <div id="progress-bar"></div>
            </div>

            <div class="q-meta">
                <span class="q-counter" id="q-counter">Question 1 / 5</span>
                <span class="q-score-live" id="q-score-live">Score: 0</span>
            </div>

            <p id="question-text"></p>

            <div class="options-grid" id="options-grid"></div>

            <div id="feedback"></div>

            <button id="next-btn">Next question →</button>
        </div>

        <!-- ── SCREEN 3: Results ── -->
        <div id="results-screen" class="screen">
            <div class="result-ring">
                <span class="big-num" id="final-score">0</span>
                <span class="out-of" id="final-out-of">/ 5</span>
            </div>
            <h2 id="result-heading"></h2>
            <p id="result-message"></p>
            <div class="result-breakdown" id="result-breakdown"></div>
            <div class="btn-row">
                <button class="btn-outline" id="change-topic-btn">Change topic</button>
                <button class="btn-primary" id="retry-btn">Play again</button>
            </div>
        </div>

    </div>

    <!-- External JavaScript logic -->
    <script src="quiz-game.js"></script>
</body>

</html>
