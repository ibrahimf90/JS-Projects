<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App | Creative Developer Portfolio</title>
    <link rel="stylesheet" href="todo-app.css?v=3.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- Ambient Background -->
    <div class="ambient" aria-hidden="true">
      <div class="ambient__orb ambient__orb--1"></div>
      <div class="ambient__orb ambient__orb--2"></div>
      <div class="ambient__orb ambient__orb--3"></div>
      <div class="ambient__grid"></div>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="header__inner">
        <a href="../../index.html" class="header__back">
          <i class="fas fa-arrow-left" aria-hidden="true"></i>
          <span>Back to Projects Hub</span>
        </a>
        <div class="header__brand">
          <div class="header__icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <h1>Todo App</h1>
        </div>
        <div class="header__date" id="header-date">—</div>
      </div>
    </header>

    <!-- Main -->
    <main class="main">
      <div class="layout">
        <!-- App Card -->
        <div class="app-card">
          <div class="app-card__header">
            <div class="app-card__title-group">
              <h2 class="app-title">Task Workspace</h2>
              <p class="app-subtitle">Manage and track your goals with local storage persistence.</p>
            </div>
            
            <button id="open-task-form-btn" class="btn btn-add-new">
              <i class="fas fa-plus"></i> Add New Task
            </button>
          </div>

          <!-- Todo App Content -->
          <div class="todo-app">
            
            <!-- Dynamic task form modal -->
            <form class="task-form hidden" id="task-form">
              <div class="task-form-header">
                <h3>Task Details</h3>
                <button
                  id="close-task-form-btn"
                  class="close-task-form-btn"
                  type="button"
                  aria-label="close"
                >
                  <i class="fas fa-times"></i>
                </button>
              </div>
              <div class="task-form-body">
                <div class="input-field">
                  <label class="task-form-label" for="title-input">Title</label>
                  <div class="input-with-icon">
                    <i class="fas fa-pen-nib input-icon"></i>
                    <input
                      required
                      type="text"
                      class="form-control"
                      id="title-input"
                      value=""
                      placeholder="What needs to be done?"
                      autocomplete="off"
                    />
                  </div>
                </div>
                
                <div class="input-field">
                  <label class="task-form-label" for="date-input">Due Date</label>
                  <div class="input-with-icon">
                    <i class="fas fa-calendar-alt input-icon"></i>
                    <input type="date" class="form-control" id="date-input" value="" />
                  </div>
                </div>
                
                <div class="input-field">
                  <label class="task-form-label" for="description-input">Description</label>
                  <div class="input-with-icon input-with-icon--textarea">
                    <i class="fas fa-align-left input-icon"></i>
                    <textarea
                      class="form-control"
                      id="description-input"
                      cols="30"
                      rows="4"
                      placeholder="Add more details about this task..."
                    ></textarea>
                  </div>
                </div>
              </div>
              <div class="task-form-footer">
                <button
                  id="add-or-update-task-btn"
                  class="btn btn-save"
                  type="submit"
                >
                  Add Task
                </button>
              </div>
            </form>

            <!-- Confirmation dialog modal -->
            <dialog id="confirm-close-dialog">
              <form method="dialog" class="dialog-inner">
                <div class="dialog-icon" aria-hidden="true">
                  <i class="fas fa-exclamation-triangle"></i>
                </div>
                <p class="discard-message-text">Discard unsaved changes?</p>
                <p class="discard-subtext">You will lose all input details entered in the form.</p>
                <div class="confirm-close-dialog-btn-container">
                  <button id="cancel-btn" class="btn btn-dialog-cancel">Cancel</button>
                  <button id="discard-btn" class="btn btn-dialog-discard">Discard</button>
                </div>
              </form>
            </dialog>

            <!-- List of tasks -->
            <div id="tasks-container"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="todo-app.js"></script>
    <script>
      const d = new Date();
      document.getElementById("header-date").textContent = d.toLocaleDateString(
        "en-US",
        { weekday: "long", month: "long", day: "numeric" },
      );
    </script>
  </body>
</html>
