<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Secret Masker</title>
  <link rel="stylesheet" href="email-secret.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
</head>

<body>
  <a href="../../index.html" class="back-btn"
    style="position: absolute; top: 20px; left: 20px; color: white; text-decoration: none; font-weight: 600; background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); transition: all 0.3s ease; z-index: 10; display: flex; align-items: center; gap: 8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back to Projects Hub
  </a>
  <div class="container">
    <div class="glass-panel">
      <h1>Email Secret Masker</h1>
      <p>Protect your privacy by masking your email address.</p>

      <div class="input-group">
        <input type="email" id="emailInput" placeholder="Enter your email address..." required />
        <button id="maskBtn">Mask Email</button>
      </div>

      <div class="result-container" id="resultContainer">
        <h3>Masked Email:</h3>
        <p id="maskedResult">Your masked email will appear here.</p>
      </div>
    </div>
  </div>
  <script src="email-secret.js"></script>
</body>

</html>
